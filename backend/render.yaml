services:
  - type: web
    name: zidioconnect-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        value: zidioconnect_super_secure_key_change_this_in_production_2024
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
