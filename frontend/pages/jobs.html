<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs & Internships - ZIDIOConnect</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="page-loader" class="page-loader">
    <div class="loader-content"><div class="loader-logo">Z</div><div class="loader-bar"><div class="loader-progress"></div></div></div>
  </div>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><span class="logo-icon">Z</span><span class="logo-text">IDIO<span class="logo-highlight">Connect</span></span></a>
      <div class="nav-menu" id="nav-menu">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="jobs.html" class="nav-link active">Jobs</a>
        <a href="internships.html" class="nav-link">Internships</a>
        <a href="about.html" class="nav-link">About</a>
      </div>
      <div class="nav-actions">
        <div class="nav-auth" id="nav-auth">
          <a href="login.html" class="btn btn-outline btn-sm">Login</a>
          <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
        <div class="nav-user hidden" id="nav-user">
          <div class="notification-bell" id="notification-bell"><i class="fas fa-bell"></i><span class="notification-badge hidden" id="notification-badge">0</span></div>
          <div class="user-dropdown" id="user-dropdown">
            <div class="user-avatar" id="user-avatar"><i class="fas fa-user"></i></div>
            <div class="dropdown-menu" id="dropdown-menu">
              <a href="dashboard.html" class="dropdown-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
              <a href="profile.html" class="dropdown-item"><i class="fas fa-user-edit"></i> Profile</a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
          </div>
        </div>
        <button class="nav-toggle" id="nav-toggle"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <main style="padding-top:100px;min-height:100vh;background:var(--bg-secondary)">
    <div class="container">
      <div class="section-header animate-fade-up" style="margin-bottom:30px">
        <h2 class="section-title">Find <span class="gradient-text">Opportunities</span></h2>
        <p class="section-subtitle">Browse and filter jobs & internships from top companies</p>
      </div>

      <!-- Filters -->
      <div class="filters-bar animate-fade-up" style="background:white;padding:24px;border-radius:var(--radius-lg);margin-bottom:30px;border:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <div style="flex:1;min-width:200px">
          <input type="text" id="filter-search" class="form-control" placeholder="Search jobs, skills, companies...">
        </div>
        <select id="filter-type" class="form-control" style="width:auto;min-width:140px">
          <option value="">All Types</option>
          <option value="job">Jobs</option>
          <option value="internship">Internships</option>
        </select>
        <select id="filter-mode" class="form-control" style="width:auto;min-width:140px">
          <option value="">Work Mode</option>
          <option value="remote">Remote</option>
          <option value="onsite">Onsite</option>
          <option value="hybrid">Hybrid</option>
        </select>
        <select id="filter-experience" class="form-control" style="width:auto;min-width:140px">
          <option value="">Experience</option>
          <option value="fresher">Fresher</option>
          <option value="junior">Junior</option>
          <option value="mid">Mid-Level</option>
          <option value="senior">Senior</option>
        </select>
        <button class="btn btn-primary" id="filter-btn"><i class="fas fa-search"></i> Search</button>
      </div>

      <!-- Jobs Grid -->
      <div class="jobs-grid" id="jobs-grid">
        <div class="loading-skeleton">
          <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:30px;padding-bottom:40px"></div>
    </div>
  </main>

  <!-- Job Detail Modal -->
  <div class="modal-overlay" id="job-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-job-title">Job Title</h2>
        <div class="modal-close" id="modal-close"><i class="fas fa-times"></i></div>
      </div>
      <div id="modal-job-content"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let currentPage = 1;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('search')) document.getElementById('filter-search').value = params.get('search');
      if (params.get('type')) document.getElementById('filter-type').value = params.get('type');
      loadJobs();
    });

    document.getElementById('filter-btn').addEventListener('click', () => { currentPage = 1; loadJobs(); });
    document.getElementById('filter-search').addEventListener('keypress', (e) => { if (e.key === 'Enter') { currentPage = 1; loadJobs(); } });

    async function loadJobs() {
      const grid = document.getElementById('jobs-grid');
      const params = new URLSearchParams();
      const search = document.getElementById('filter-search').value;
      const type = document.getElementById('filter-type').value;
      const mode = document.getElementById('filter-mode').value;
      const exp = document.getElementById('filter-experience').value;

      if (search) params.set('search', search);
      if (type) params.set('type', type);
      if (mode) params.set('work_mode', mode);
      if (exp) params.set('experience_level', exp);
      params.set('page', currentPage);
      params.set('limit', 9);

      grid.innerHTML = '<div class="loading-skeleton"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';

      try {
        const res = await fetch(`${API.jobs.list}?${params.toString()}`);
        const data = await res.json();
        if (data.jobs && data.jobs.length > 0) {
          grid.innerHTML = data.jobs.map(job => createClickableJobCard(job)).join('');
          renderPagination(data.pagination);
        } else {
          grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-secondary)"><i class="fas fa-briefcase" style="font-size:48px;margin-bottom:16px;opacity:0.3"></i><p>No jobs found matching your criteria.</p></div>';
          document.getElementById('pagination').innerHTML = '';
        }
      } catch (err) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-secondary)"><p>Unable to connect to server.</p></div>';
      }
    }

    function createClickableJobCard(job) {
      const card = createJobCard(job);
      return card.replace('class="job-card hover-lift"', `class="job-card hover-lift" style="cursor:pointer" onclick="openJobModal(${job.id})"`);
    }

    function renderPagination(pagination) {
      const container = document.getElementById('pagination');
      if (pagination.pages <= 1) { container.innerHTML = ''; return; }
      let html = '';
      for (let i = 1; i <= pagination.pages; i++) {
        html += `<button class="btn ${i === pagination.page ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="goToPage(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    function goToPage(page) { currentPage = page; loadJobs(); window.scrollTo({ top: 200, behavior: 'smooth' }); }

    async function openJobModal(id) {
      const modal = document.getElementById('job-modal');
      try {
        const res = await fetch(API.jobs.single(id));
        const job = await res.json();
        document.getElementById('modal-job-title').textContent = job.title;
        document.getElementById('modal-job-content').innerHTML = `
          <div style="margin-bottom:16px"><span class="job-type-badge ${job.type === 'internship' ? 'badge-internship' : 'badge-job'}">${job.type}</span></div>
          <p style="margin-bottom:8px"><strong>Company:</strong> ${job.company_name || 'N/A'}</p>
          <p style="margin-bottom:8px"><strong>Location:</strong> ${job.location || 'Remote'} (${job.work_mode || 'N/A'})</p>
          <p style="margin-bottom:8px"><strong>Experience:</strong> ${job.experience_level || 'Any'}</p>
          <p style="margin-bottom:8px"><strong>Salary:</strong> ${job.salary_min && job.salary_max ? '₹' + job.salary_min + ' - ₹' + job.salary_max : 'Not disclosed'}</p>
          <p style="margin-bottom:8px"><strong>Skills:</strong> ${job.skills_required || 'N/A'}</p>
          <p style="margin-bottom:8px"><strong>Applications:</strong> ${job.application_count || 0}</p>
          <hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">
          <h4 style="margin-bottom:8px">Description</h4>
          <p style="color:var(--text-secondary);line-height:1.7;white-space:pre-wrap">${job.description}</p>
          ${Auth.isLoggedIn() && Auth.getUser().role === 'student' ? `<button class="btn btn-primary" style="margin-top:20px;width:100%;justify-content:center" onclick="applyForJob(${job.id})"><i class="fas fa-paper-plane"></i> Apply Now</button>` : !Auth.isLoggedIn() ? `<a href="login.html" class="btn btn-primary" style="margin-top:20px;width:100%;justify-content:center"><i class="fas fa-sign-in-alt"></i> Login to Apply</a>` : ''}
        `;
        modal.classList.add('show');
      } catch (err) { showToast('Failed to load job details', 'error'); }
    }

    document.getElementById('modal-close').addEventListener('click', () => document.getElementById('job-modal').classList.remove('show'));
    document.getElementById('job-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });

    async function applyForJob(jobId) {
      try {
        const res = await fetch(API.applications.apply, {
          method: 'POST', headers: Auth.getHeaders(), body: JSON.stringify({ job_id: jobId })
        });
        const data = await res.json();
        if (res.ok) { showToast('Application submitted!', 'success'); document.getElementById('job-modal').classList.remove('show'); }
        else showToast(data.message, 'error');
      } catch (err) { showToast('Failed to apply', 'error'); }
    }
  </script>
</body>
</html>
